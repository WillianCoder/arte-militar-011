<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Título e descrição que aparecem no Google e ao compartilhar o link -->
  <title>Arte Militar 011 — Artigos Militares e Táticos em São Paulo</title>
  <meta name="description" content="Coturnos, fardas, coletes, mochilas, facas, lanternas e equipamentos táticos. Loja física em São Paulo, envio para todo o Brasil e pedidos pelo WhatsApp.">
  <meta name="theme-color" content="#0e100c">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Arte Militar 011">
  <meta property="og:title" content="Arte Militar 011 — Artigos Militares e Táticos">
  <meta property="og:description" content="Coturnos, fardas, equipamentos táticos, mochilas e camping. Loja física em SP e pedidos pelo WhatsApp.">
  <meta property="og:image" content="https://williancoder.github.io/arte-militar-011/img/compartilhar.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">

  <!-- Ordem importa: dados primeiro, depois a lógica e por último a tela.
       config.js e tema.js sem "defer": pintam as cores da paleta antes de a página aparecer -->
  <script src="js/config.js"></script>
  <script src="js/tema.js"></script>
  <script src="js/produtos.js" defer></script>
  <script src="js/ilustracoes.js" defer></script>
  <script src="js/pedido.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <!-- Barra superior: só aparece no celular -->
  <header class="barra-movel">
    <button class="btn-icone" type="button" id="abrir-menu" aria-controls="lateral" aria-expanded="false" aria-label="Abrir menu"></button>
    <a class="logo logo--compacto" href="#/" aria-label="Arte Militar 011 — página inicial"></a>
    <a class="btn-icone btn-pedido-movel" href="#/pedido" aria-label="Meu pedido"></a>
  </header>

  <div class="app">
    <!-- Painel lateral: montado pelo js/app.js a partir do js/config.js -->
    <aside class="lateral" id="lateral" aria-label="Navegação da loja"></aside>
    <div class="sombra" id="sombra" hidden></div>

    <div class="principal">
      <div class="aviso-topo" id="aviso-topo" hidden></div>
      <main id="conteudo" tabindex="-1">
        <noscript>
          <div class="pagina"><h1>Ative o JavaScript</h1><p>Para ver os produtos e fazer pedidos, ative o JavaScript do navegador.</p></div>
        </noscript>
      </main>
      <footer class="rodape" id="rodape"></footer>
    </div>
  </div>

  <a class="whats-flutuante" id="whats-flutuante" href="#" target="_blank" rel="noopener" aria-label="Falar no WhatsApp"></a>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
